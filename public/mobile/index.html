<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Controle Financeiro</title>

<link rel="manifest" href="/mobile/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Controle Financeiro">
<link rel="apple-touch-icon" href="/mobile/icons/icon-180.png">
<link rel="icon" href="/mobile/icons/icon-192.png">
<meta name="theme-color" content="#f3f4f9">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mobile/style.css">
<script>
  try {
    if (localStorage.getItem("temaEscuro") === "true") {
      document.documentElement.setAttribute("data-tema", "escuro");
    }
  } catch (e) {}
</script>
</head>
<body>

<div id="moldura">

<div id="carregando" class="carregando-tela">Carregando...</div>

<!-- Login -->
<div id="tela-login" class="tela-login hidden">
  <div class="logo">
    <div class="logo-mark">$</div>
    <div>
      <h1>Controle Financeiro</h1>
      <span>Seu plano financeiro, no bolso.</span>
    </div>
  </div>
  <div class="field">
    <label for="login-email">E-mail</label>
    <input id="login-email" type="email" autocomplete="username" placeholder="voce@exemplo.com">
  </div>
  <div class="field">
    <label for="login-senha">Senha</label>
    <input id="login-senha" type="password" autocomplete="current-password" placeholder="••••••••">
  </div>
  <button class="btn" id="btn-entrar">Entrar</button>
  <button class="btn-ghost" id="btn-esqueci">Esqueci minha senha</button>
  <p class="aviso">Use a mesma conta do sistema web.</p>
  <div id="msg-login"></div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header class="topbar">
    <button class="icone-btn casinha" id="btn-inicio" aria-label="Voltar ao início" title="Início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 9.8V19a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.8"/></svg>
    </button>
    <div class="topbar-marca">
      <span>Controle Financeiro <small class="versao-app">02.80</small></span>
    </div>
    <button class="avatar" id="btn-avatar" aria-label="Usuário" aria-haspopup="true" aria-expanded="false">U</button>
  </header>

  <!-- Menu do usuário (toque no avatar) -->
  <div class="menu-usuario-fundo hidden" id="menu-usuario-fundo"></div>
  <div class="menu-usuario hidden" id="menu-usuario" role="menu">
    <div class="menu-usuario-cabecalho">
      <div class="avatar grande" id="menu-avatar">U</div>
      <div class="menu-usuario-dados">
        <strong id="menu-nome">—</strong>
        <span id="menu-email">—</span>
      </div>
    </div>
    <button class="menu-usuario-item" id="btn-tema" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      <span id="texto-tema">Tema escuro</span>
    </button>
    <button class="menu-usuario-item sair" id="btn-sair" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
  </div>

  <!-- Tudo abaixo do topo: a folha de lançamentos abre por cima daqui, mantendo o topo visível -->
  <div id="corpo">
  <div class="seletor-mes">
    <button id="mes-anterior" aria-label="Mês anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="mes-atual" id="mes-atual" title="Voltar para o mês atual">—</button>
    <button id="mes-proximo" aria-label="Próximo mês">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <main id="conteudo">
    <!-- Aba Aplicações -->
    <section id="aba-aplicacoes">
      <div class="resumo" id="resumo-mes"></div>
      <div class="filtro-status" id="filtro-status" role="radiogroup" aria-label="Filtrar Aplicações">
        <button role="radio" data-filtro="todos" class="ativo" aria-checked="true">Todos</button>
        <button role="radio" data-filtro="verdes" aria-checked="false"><span class="ponto verde-bg"></span>No limite</button>
        <button role="radio" data-filtro="vermelhos" aria-checked="false"><span class="ponto vermelho-bg"></span>Fora do limite</button>
      </div>
      <div class="grade-cards" id="grade-cards"></div>
      <div class="resumo-status" id="status-cards"></div>
    </section>

    <!-- Aba Distribuição -->
    <section id="aba-distribuicao" class="hidden">
      <div class="distrib-cabecalho" id="distrib-cabecalho"></div>
      <div class="distrib-lista" id="distrib-lista"></div>
      <p class="legenda">A distribuição é configurada no sistema web, na tela Plano Financeiro.</p>
    </section>
  </main>

  <nav class="abas">
    <button class="aba ativa" data-aba="aplicacoes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      Aplicações
    </button>
    <button class="aba" data-aba="distribuicao">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 3v9l7.8 4.5"/><circle cx="12" cy="12" r="9"/></svg>
      Distribuição
    </button>
  </nav>

  <!-- Lançamentos de uma Aplicação no mês -->
  <div class="folha hidden" id="folha-lancamentos" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
    <header class="folha-topo">
      <button class="icone-btn" id="btn-fechar-folha" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </button>
      <div>
        <h2 id="folha-titulo">—</h2>
        <span id="folha-subtitulo">—</span>
      </div>
    </header>
    <div class="folha-resumo" id="folha-resumo"></div>
    <div class="folha-lista" id="folha-lista"></div>
  </div>
  </div>
</div>

</div>

<script type="module" src="/mobile/app.js"></script>
</body>
</html>
